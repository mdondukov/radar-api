name: Deploy

# Deliberately manual: a radar-api release often has to be paired with a
# content re-seed (see seed.yml), and pushing to dev should not move
# production on its own.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy
        required: false
        default: dev

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/radar-api

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native arm64 build — no QEMU, the runner is already aarch64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Pull the new image and recreate the service
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -e
            cd /opt/docker/compose/biom_app
            docker compose pull radar-api
            docker compose up -d --force-recreate radar-api
            # the proxy container caches the old container IP otherwise
            docker compose restart proxy
            docker image prune -f
          '

      - name: Smoke check
        run: |
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://radar.biom.kg/radar/health) || true
            [ "$code" = "200" ] && echo "health: 200" && exit 0
            sleep 3
          done
          echo "health check failed (last code: $code)" >&2
          exit 1
