name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # ARM runner: the production host is aarch64, and building/testing on the
    # same architecture keeps CI honest about what actually ships.
    runs-on: ubuntu-24.04-arm

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite runs against a real Postgres — the schema uses JSONB and
      # native enums, so a mocked database would not prove much.
      RADAR_TEST_DATABASE_URL: postgresql+asyncpg://radar:radar@localhost:5432/radar_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Types
        run: uv run mypy app tests

      - name: Tests
        run: uv run pytest -q
